<!DOCTYPE html>
<!-- Assignment 7 : JS VALIDATION of the registration page
       3. E-mail id    - must follow the standard pattern name@domain.com
       4. Phone Number - should contain 10 digits only -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration - Online Book Store</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<script>
  // When opened inside the frames of Assignment 1, hide this page's own header and side menu
  if (window.self !== window.top) document.documentElement.className = "in-frame";
</script>
<style>
  body { margin: 0; font-family: Calibri, Arial, sans-serif; color: #222; }
  .layout { width: 90%; margin: 20px auto; border-collapse: collapse; border: 1px solid #555; }
  .layout > tbody > tr > td { border: 1px solid #555; padding: 8px 12px; }
  .logo, .site-name { background: #f8c08f; text-align: center; font-weight: bold; font-size: 20px; }
  .nav td { background: #fce4d6; text-align: center; }
  .nav a { display: block; color: #222; text-decoration: none; }
  .nav a:hover, .nav a.active { color: #c0392b; font-weight: bold; }
  .side { width: 130px; vertical-align: top; }
  .side a { display: block; padding: 8px 0; color: #222; text-decoration: none; }
  .side a:hover { color: #c0392b; }
  .content { vertical-align: top; }
  .in-frame .site-header, .in-frame .side { display: none; }
  .in-frame .layout { width: 100%; margin: 0; border: none; }
  .in-frame .layout > tbody > tr > td { border: none; }

  /* Registration form */
  h3 { text-align: center; color: #a04000; }
  .form-table { margin: 0 auto; }
  .form-table td { padding: 7px; vertical-align: top; }
  .form-table td:first-child { text-align: right; font-weight: bold; width: 150px; }
  input[type="text"], input[type="password"], textarea { width: 240px; padding: 5px; border: 1px solid #888; border-radius: 4px; }
  select { padding: 4px; }
  .buttons { text-align: center; padding-top: 12px; }
  .buttons input { padding: 8px 24px; margin: 0 8px; font-size: 15px; cursor: pointer; }
  .error { display: block; color: #d00; font-size: 13px; }
  .invalid { border-color: #d00 !important; background: #fff0f0; }
</style>
</head>
<body>
  <table class="layout">
    <tr class="site-header">
      <td class="logo">📚 Logo</td>
      <td class="site-name" colspan="4">Online Book Store</td>
    </tr>
    <tr class="site-header nav">
      <td><a href="assignment%201.html" target="_top">Home</a></td>
      <td><a href="assignment%202.html">Login</a></td>
      <td><a href="assignment%205.html" class="active">Registration</a></td>
      <td><a href="assignment%203.html">Catalogue</a></td>
      <td><a href="assignment%204.html">Cart</a></td>
    </tr>
    <tr>
      <td class="side">
        <a href="assignment%203.html#cse">CSE</a>
        <a href="assignment%203.html#ece">ECE</a>
        <a href="assignment%203.html#eee">EEE</a>
        <a href="assignment%203.html#civil">CIVIL</a>
      </td>
      <td class="content" colspan="4">
        <h3>Registration Form</h3>
        <form name="regForm" action="#" method="post" onsubmit="return validateForm()">
          <table class="form-table">
            <!-- 1) Name -->
            <tr>
              <td><label for="name">Name :</label></td>
              <td><input type="text" id="name" name="name"></td>
            </tr>
            <!-- 2) Password -->
            <tr>
              <td><label for="password">Password :</label></td>
              <td><input type="password" id="password" name="password"></td>
            </tr>
            <!-- 3) E-mail id -->
            <tr>
              <td><label for="email">E-mail id :</label></td>
              <td><input type="text" id="email" name="email" placeholder="name@domain.com"><span class="error" id="emailError"></span></td>
            </tr>
            <!-- 4) Phone number -->
            <tr>
              <td><label for="phone">Phone Number :</label></td>
              <td><input type="text" id="phone" name="phone" maxlength="10"><span class="error" id="phoneError"></span></td>
            </tr>
            <!-- 5) Sex -->
            <tr>
              <td>Sex :</td>
              <td>
                <input type="radio" id="male" name="sex" value="Male"> <label for="male">Male</label>
                <input type="radio" id="female" name="sex" value="Female"> <label for="female">Female</label>
              </td>
            </tr>
            <!-- 6) Date of birth (3 select boxes) -->
            <tr>
              <td>Date of Birth :</td>
              <td>
                <select name="day" id="day"><option value="">Day</option></select>
                <select name="month" id="month">
                  <option value="">Month</option>
                  <option>Jan</option><option>Feb</option><option>Mar</option><option>Apr</option>
                  <option>May</option><option>Jun</option><option>Jul</option><option>Aug</option>
                  <option>Sep</option><option>Oct</option><option>Nov</option><option>Dec</option>
                </select>
                <select name="year" id="year"><option value="">Year</option></select>
              </td>
            </tr>
            <!-- 7) Languages known -->
            <tr>
              <td>Languages Known :</td>
              <td>
                <input type="checkbox" id="english" name="lang" value="English"> <label for="english">English</label>
                <input type="checkbox" id="telugu" name="lang" value="Telugu"> <label for="telugu">Telugu</label>
                <input type="checkbox" id="hindi" name="lang" value="Hindi"> <label for="hindi">Hindi</label>
                <input type="checkbox" id="tamil" name="lang" value="Tamil"> <label for="tamil">Tamil</label>
              </td>
            </tr>
            <!-- 8) Address -->
            <tr>
              <td><label for="address">Address :</label></td>
              <td><textarea id="address" name="address" rows="4"></textarea></td>
            </tr>
            <tr>
              <td colspan="2" class="buttons">
                <input type="submit" value="Register">
                <input type="reset" value="Reset">
              </td>
            </tr>
          </table>
        </form>
      </td>
    </tr>
  </table>

<script>
  // Fill the Day (1-31) and Year select boxes using loops
  var daySelect = document.getElementById("day");
  for (var d = 1; d <= 31; d++) {
    daySelect.innerHTML += "<option>" + d + "</option>";
  }
  var yearSelect = document.getElementById("year");
  for (var y = new Date().getFullYear(); y >= 1960; y--) {
    yearSelect.innerHTML += "<option>" + y + "</option>";
  }

  // Show or clear an error message below a field
  function setError(fieldId, message) {
    document.getElementById(fieldId + "Error").textContent = message;
    document.getElementById(fieldId).className = message ? "invalid" : "";
  }

  // 3. E-mail: must follow the pattern name@domain.com
  function validateEmail() {
    var email = document.getElementById("email").value.trim();
    var pattern = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/;
    if (email === "") {
      setError("email", "E-mail id is required.");
      return false;
    }
    if (!pattern.test(email)) {
      setError("email", "Enter a valid e-mail id (e.g. name@domain.com).");
      return false;
    }
    setError("email", "");
    return true;
  }

  // 4. Phone number: exactly 10 digits
  function validatePhone() {
    var phone = document.getElementById("phone").value.trim();
    if (!/^[0-9]{10}$/.test(phone)) {
      setError("phone", "Phone number should contain exactly 10 digits.");
      return false;
    }
    setError("phone", "");
    return true;
  }

  // Called when the form is submitted; returning false stops the submission
  function validateForm() {
    var emailOk = validateEmail();
    var phoneOk = validatePhone();
    if (emailOk && phoneOk) {
      alert("Registration successful!");
    }
    return false;   // no server for this assignment, so always stay on the page
  }

  // Validate each field as soon as the user leaves it
  document.getElementById("email").onblur = validateEmail;
  document.getElementById("phone").onblur = validatePhone;

  // Clear error messages when the form is reset
  document.forms["regForm"].onreset = function () {
    setError("email", "");
    setError("phone", "");
  };
</script>
</body>
</html>
